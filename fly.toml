app = 'clinicdesk-ai'
primary_region = 'sjc'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[env]
  APP_ENV = 'production'
  APP_PORT = '8080'
  GOOGLE_CREDENTIALS_PATH = './credentials.json'
  GOOGLE_CALENDAR_ID = 'clinicdeskai@gmail.com'
  SENDGRID_FROM_EMAIL = 'oscarmarulandab@gmail.com'
  SUPPORT_TEAM_EMAIL = 'clinicdeskai@gmail.com'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
